<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Pantau biaya produksi, anggaran proyek, dan rekonsiliasi pengeluaran AI dalam satu tempat.">
  <title>Production Ledger — Cost Tracker</title>
  <link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Lewati ke konten</a>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="Production Ledger beranda"><span class="brand-mark">p<span>l</span></span><span>production<span class="brand-sub">ledger</span></span></a>
    <div class="workspace"><span class="workspace-icon">P</span><div>Production workspace<small>Internal operations</small></div></div>
    <p class="nav-label">WORKSPACE</p>
    <nav aria-label="Navigasi utama">
      <button data-view="overview" class="nav-item active"><span class="nav-symbol">◫</span>Overview</button>
      <button data-view="projects" class="nav-item"><span class="nav-symbol">▤</span>Proyek</button>
      <button data-view="transactions" class="nav-item"><span class="nav-symbol">⇄</span>Transaksi</button>
      <button data-view="imports" class="nav-item"><span class="nav-symbol">↥</span>Sumber & import</button>
      <button data-view="alerts" class="nav-item"><span class="nav-symbol">⚑</span>Notifikasi<span id="alert-count" class="nav-count">0</span></button>
    </nav>
    <div class="sidebar-bottom"><div class="local-label"><span class="status-dot"></span>Local workspace</div><button id="theme" class="theme-button">Ganti ke tema gelap <span>◐</span></button><div class="profile"><span class="avatar">OP</span><div>Operations team<small>Production finance</small></div></div></div>
  </aside>
  <div class="shell"><header class="topbar"><span>Workspace <span class="slash">/</span> <span id="breadcrumb">Overview</span></span><span class="timezone">Waktu Indonesia Barat <span>UTC+7</span></span></header>
    <main id="main" tabindex="-1"><div id="app"><p class="loading">Memuat workspace…</p></div></main>
    <footer>Production Ledger <span>Biaya dalam IDR · Waktu dalam WIB</span></footer>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
