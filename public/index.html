<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="KU Creatives production finance. Pantau pengeluaran, anggaran, dan transaksi produksi.">
  <title>KU Creatives | Production Finance</title>
  <link rel="preload" href="/assets/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css"><script src="/app.js" type="module"></script>
</head>
<body>
  <a class="skip" href="#main">Lewati ke konten</a>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="KU Creatives beranda"><img src="/assets/ku-creatives-logo.png" alt="KU Creatives" width="160" height="30"></a>
    <nav aria-label="Navigasi utama">
      <button data-view="overview" class="nav-item active"><span data-icon="layout-dashboard"></span>Overview</button>
      <button data-view="projects" class="nav-item"><span data-icon="folder-open"></span>Proyek</button>
      <button data-view="transactions" class="nav-item"><span data-icon="arrow-left-right"></span>Transaksi</button>
      <button data-view="imports" class="nav-item"><span data-icon="database"></span>Sumber & import</button>
      <button data-view="alerts" class="nav-item"><span data-icon="bell"></span>Notifikasi<span id="alert-count" class="nav-count">0</span></button>
    </nav>
  </aside>
  <div class="shell"><header class="topbar"><div class="breadcrumbs"><span>Production Finance</span><span class="crumb-divider" data-icon="chevron-right"></span><span id="breadcrumb">Overview</span></div><div class="topbar-actions"><span class="timezone">WIB</span><button id="theme" class="icon-button" aria-label="Gunakan tema terang" title="Gunakan tema terang"><span data-icon="sun"></span></button></div></header>
    <main id="main" tabindex="-1"><div id="app"><p class="loading">Memuat workspace...</p></div></main>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <dialog id="record-dialog" aria-labelledby="record-title"><div id="record-content"></div></dialog>
</body>
</html>
